<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Register - CBT</title>
  <style>
    body{font-family:Arial,Helvetica,sans-serif;background:#f6f8fa;padding:24px}
    .card{max-width:520px;margin:24px auto;padding:20px;background:#fff;border-radius:6px;box-shadow:0 6px 18px rgba(0,0,0,.06)}
    .form-group{margin-bottom:12px}
    label{display:block;margin-bottom:6px;font-weight:600}
    input,select{width:100%;padding:8px;border:1px solid #ddd;border-radius:4px}
    button{padding:10px 14px;border:none;background:#2563eb;color:#fff;border-radius:4px}
  </style>
</head>
<body>
  <div class="card">
    <h2>Student Registration</h2>
    <form action="/register" method="post" enctype="multipart/form-data">
      <div class="form-group">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" required>
      </div>
      <div class="form-group">
        <label for="full_name">Full name</label>
        <input id="full_name" name="full_name" type="text">
      </div>
      <div class="form-group">
        <label for="school_id">School</label>
        <select id="school_id" name="school_id">
          <option value="">(none)</option>
          {% for s in schools %}
            <option value="{{ s.id }}">{{ s.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label for="school_code">School access code (if required)</label>
        <input id="school_code" name="school_code" type="text">
      </div>
      <div class="form-group">
        <label for="student_class">Class</label>
        <select id="student_class" name="student_class">
          <option value="">(optional)</option>
          {% for cl in classes %}
            <option value="{{ cl }}">{{ cl }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label for="gender">Gender</label>
        <select id="gender" name="gender">
          <option value="">Prefer not to say</option>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
        </select>
      </div>
      <div class="form-group">
        <label for="passport">Passport (optional)</label>
        <input id="passport" name="passport" type="file" accept="image/*">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required>
      </div>
      <div style="margin-top:10px"><button type="submit">Register</button></div>
    </form>
    <p style="margin-top:12px">Already registered? <a href="/login">Login</a></p>
  </div>
</body>
</html>
