{% extends "base.html" %}

{% block public_content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-4">
        <div class="card shadow">
            <div class="card-header bg-primary text-white text-center">
                <h4><i class="fas fa-sign-in-alt me-2"></i>Login</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('login') }}">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" name="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <div class="mb-3">
                        <label for="school_name" class="form-label">School</label>
                        <input list="school_list" class="form-control" id="school_name" name="school_name" placeholder="Start typing school name to find it">
                        <datalist id="school_list">
                            {% for school in schools %}
                            <option value="{{ school.name }}" data-id="{{ school.id }}"></option>
                            {% endfor %}
                        </datalist>
                        <input type="hidden" id="school_id" name="school_id">
                        <div class="form-text">Choose your school by typing and selecting from the list.</div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Login</button>
                </form>
                <div class="text-center mt-3">
                    <p>Don't have an account? <a href="{{ url_for('register') }}">Register here</a></p>
                    <p>
                        <a href="{{ url_for('start_quick') }}" class="btn btn-success mt-2">Start CBT Exam Now</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
const schoolOptions = Array.from(document.querySelectorAll('#school_list option'));
const schoolNameInput = document.getElementById('school_name');
const schoolIdInput = document.getElementById('school_id');

if (schoolNameInput) {
    schoolNameInput.addEventListener('input', () => {
        const value = schoolNameInput.value.trim();
        const match = schoolOptions.find(o => o.value === value);
        schoolIdInput.value = match ? match.dataset.id : '';
    });
}
</script>
{% endblock %}
